# =====================================================================
# Platform 3-component (W9-ready) deploy len cum W8 (kind/minikube tren EC2).
# frontend = NodePort 30080 -> ALB tro vao (giu nguyen duong ALB cua W8).
# Day cung la 'k8s/base' source cho GitOps o W9-D1 (commit len git).
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: demo
data:
  API_URL: "http://api:8080"
---
# ---------- api: service loi (HPA + graceful shutdown) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
  labels: { app: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: registry.k8s.io/hpa-example
          ports: [ { containerPort: 80 } ]
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits:   { cpu: "300m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
# ---------- frontend: dung sau ALB (NodePort 30080) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  labels: { app: frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: frontend
          image: nginxdemos/hello:plain-text
          ports: [ { containerPort: 80 } ]
          env:
            - name: API_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: API_URL } }
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 3"] }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
  labels: { app: frontend }
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080      # ALB target group tro vao cong nay (var.node_port=30080)
---
# ---------- worker: background job + graceful shutdown ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: demo
  labels: { app: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              trap 'echo "[worker] SIGTERM -> draining..."; sleep 3; echo "[worker] bye"; exit 0' TERM
              while true; do echo "[worker] processing job $(date +%T)"; sleep 5 & wait $!; done
          resources:
            requests: { cpu: "25m", memory: "16Mi" }
            limits:   { cpu: "100m", memory: "32Mi" }
---
# ---------- NetworkPolicy (zero-trust). CHI enforce neu CNI ho tro (Calico). ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: demo
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: demo
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-from-frontend
  namespace: demo
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: frontend } }
      ports:
        - { protocol: TCP, port: 80 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-to-api
  namespace: demo
spec:
  podSelector: { matchLabels: { app: frontend } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: api } }
      ports:
        - { protocol: TCP, port: 80 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-ingress
  namespace: demo
spec:
  podSelector: { matchLabels: { app: frontend } }
  policyTypes: [Ingress]
  ingress:
    - {}     # cho ALB (va port-forward) vao frontend
