# NetworkPolicy (zero-trust). sync-wave 0. CHI enforce neu CNI ho tro (kindnet KHONG enforce).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: demo
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: demo
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [ { namespaceSelector: {} } ]
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-from-frontend
  namespace: demo
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress]
  ingress:
    - from: [ { podSelector: { matchLabels: { app: frontend } } } ]
      ports: [ { protocol: TCP, port: 80 } ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-to-api
  namespace: demo
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  podSelector: { matchLabels: { app: frontend } }
  policyTypes: [Egress]
  egress:
    - to: [ { podSelector: { matchLabels: { app: api } } } ]
      ports: [ { protocol: TCP, port: 80 } ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-ingress
  namespace: demo
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  podSelector: { matchLabels: { app: frontend } }
  policyTypes: [Ingress]
  ingress: [ {} ]
