# api: service loi (HPA + graceful shutdown). KHONG khai 'replicas' vi HPA so huu so ban
# (tranh ArgoCD va HPA "danh nhau" ve replicas). Bump RAM limit -> tranh OOM CrashLoopBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
  labels: { app: api }
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: registry.k8s.io/hpa-example
          ports: [ { containerPort: 80 } ]
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }    # tang tu 128Mi -> 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
  labels: { app: api }
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: demo
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
