# worker: background job + graceful shutdown (bay SIGTERM).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: demo
  labels: { app: worker }
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              trap 'echo "[worker] SIGTERM -> draining..."; sleep 3; echo "[worker] bye"; exit 0' TERM
              while true; do echo "[worker] processing job $(date +%T)"; sleep 5 & wait $!; done
          resources:
            requests: { cpu: "25m", memory: "16Mi" }
            limits:   { cpu: "100m", memory: "32Mi" }
