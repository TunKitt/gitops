# frontend: dung sau ALB (NodePort 30080). replicas 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  labels: { app: frontend }
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: frontend
          image: nginxdemos/hello:plain-text
          ports: [ { containerPort: 80 } ]
          env:
            - name: API_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: API_URL } }
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 3"] }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
  labels: { app: frontend }
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080      # ALB tro vao cong nay
